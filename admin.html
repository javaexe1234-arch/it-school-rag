<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ-панель — IT-школа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
</head>
<body>

  <!-- Вход -->
  <div class="admin-login" id="loginScreen">
    <form class="admin-login__box" id="loginForm">
      <div class="logo" style="justify-content:center"><span class="logo__mark">&lt;/&gt;</span></div>
      <h1>Вход в админ-панель</h1>
      <label class="field"><span>Логин</span><input name="login" autocomplete="username" required></label>
      <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn--primary btn--block">Войти</button>
      <p class="form__status err" id="loginError"></p>
      <p class="admin-login__hint">Демо-доступ: <b>admin</b> / <b>admin123</b><br>Пароль можно сменить в разделе «Настройки».</p>
      <a href="index.html" class="admin-login__hint">← Вернуться на сайт</a>
    </form>
  </div>

  <!-- Панель -->
  <div class="admin" id="adminApp" hidden>
    <aside class="admin__side" id="adminSide">
      <a href="index.html" class="logo"><span class="logo__mark">&lt;/&gt;</span><span>Админ-панель</span></a>
      <button class="admin__tab active" data-tab="dashboard">📊 Обзор</button>
      <button class="admin__tab" data-tab="school">🏫 О школе и Hero</button>
      <button class="admin__tab" data-tab="stats">📈 Статистика</button>
      <button class="admin__tab" data-tab="directions">💻 Направления</button>
      <button class="admin__tab" data-tab="teachers">👩‍🏫 Учителя</button>
      <button class="admin__tab" data-tab="news">📰 Новости и события</button>
      <button class="admin__tab" data-tab="messages">✉️ Заявки <span class="count" id="unreadCount" hidden></span></button>
      <button class="admin__tab" data-tab="settings">⚙️ Настройки</button>
      <div class="admin__side-bottom">
        <a href="index.html" target="_blank" class="btn btn--ghost btn--sm">↗ Открыть сайт</a>
        <button class="btn btn--ghost btn--sm" id="logoutBtn">Выйти</button>
      </div>
    </aside>

    <main class="admin__main">
      <div class="admin__top">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="icon-btn admin__burger" id="adminBurger" aria-label="Меню">☰</button>
          <h2 id="pageTitle">Обзор</h2>
        </div>
        <div class="admin__top-actions">
          <span id="topActions"></span>
          <button class="icon-btn" id="themeToggle" aria-label="Тема">
            <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>
      <div id="adminContent"></div>
    </main>
  </div>

  <!-- Модалка редактирования -->
  <div class="modal" id="editModal" aria-hidden="true">
    <div class="modal__overlay" data-close></div>
    <div class="modal__box" role="dialog" aria-modal="true" style="max-width:760px">
      <button class="modal__close" data-close aria-label="Закрыть">×</button>
      <h3 id="editTitle" style="margin-bottom:18px;padding-right:40px"></h3>
      <form id="editForm" style="display:grid;gap:14px"></form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/admin.js"></script>
</body>
</html>
